EXP_NAME: FutabaSmoke3DVGGTPriorSpatial1000

DATASET:
  NAME: FutabaSmokeRaw
  DATA_PATH: data/smoke/development/Futaba
  CLEAN_DATA_PATH: data/smoke_ensemble_clean/development/Futaba
  BACKGROUND_COLOR: 255.0
  PRIOR_ROOT: data/priors/Futaba
  DEPTH_SUBDIR: depth
  POINTMAP_SUBDIR: vggt/pointmaps
  FEATURE_SUBDIR: features
  CLEAN_CONFIDENCE_MODE: difference
  CLEAN_CONFIDENCE_POWER: 2.0
  DEPTH_RESIZE_MODE: bilinear
  DEPTH_NORMALIZE: per_image_minmax
  DEPTH_INVERT: false
  VAL_PREVIEW_VIEWS: 4

MODEL:
  NAME: SmokeAware3DGS
  NUM_INIT_POINTS: 100000
  PER_VIEW_SMOKE: true
  SPATIAL_SMOKE_GRID_SIZE: 16
  PATH_LENGTH_MODE: expected_depth
  SH_DEGREE: 3
  SCENE_SCALE: 2.0
  LR_MEANS: 0.00016
  LR_MEANS_FINAL: 1.6e-06
  LR_QUATS: 0.001
  LR_SCALES: 0.005
  LR_OPACITIES: 0.05
  LR_SH0: 0.0025
  LR_SHN: 0.000125
  LR_SMOKE: 0.001
  DENSIFY_START_STEP: 100
  DENSIFY_STOP_STEP: 15000
  DENSIFY_INTERVAL: 100
  DENSIFY_GRAD_THRESH: 0.0002
  OPACITY_RESET_INTERVAL: 100000
  INIT_BETA: 0.20
  INIT_AIRLIGHT: [0.85, 0.85, 0.85]
  INIT_TRANSMISSION_BIAS: 0.05
  MIN_TRANSMISSION: 0.05

LOSS:
  LAMBDA_SSIM: 0.2
  CLEAN_WEIGHT: 0.15
  CLEAN_LOSS_WEIGHT_FLOOR: 0.2
  DEPTH_WEIGHT: 0.05
  POINTMAP_WEIGHT: 0.02
  POINTMAP_RGB_WEIGHT: 0.08
  POINTMAP_DEPTH_WEIGHT: 0.05
  DEPTH_TARGET: inverse_expected_depth_normalized
  DEPTH_LOSS_TYPE: l1
  POINTMAP_LOSS_WEIGHT_FLOOR: 0.0
  FEATURE_WEIGHT: 0.0
  SMOKE_SPARSE_WEIGHT: 0.01
  AIRLIGHT_PRIOR_WEIGHT: 0.01

RUNNER:
  TRAIN_TOTAL_STEP: 1000
  VAL_INTERVAL_STEP: 500
  LOG_INTERVAL_STEP: 100
  SH_UPGRADE_INTERVAL: 200
  DEVICE: cuda
  OUTPUT_ROOT: outputs
  RENDER_CLEAN_ON_TEST: true
